<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P.A.L.M · 对话</title>
<link rel="stylesheet" href="./ui/theme.css" />
<link rel="stylesheet" href="./ui/base.css" />
</head>
<body>
<div class="main" style="padding:20px 24px;max-width:1080px">
  <h1>对话</h1>
  <div class="sub">SSE 流式 · 思维链增量（delta/reasoning）· 契约：POST /api/chat</div>
  <div class="panel">
    <div id="chat-log" style="min-height:200px;max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px">
      <div class="sub">输入下方消息开始对话；后端未连接时提示降级。</div>
    </div>
    <div style="display:flex;gap:8px">
      <input class="txt" id="chat-input" style="flex:1" placeholder="输入消息…（Enter 发送）" />
      <button class="btn" id="chat-send">发送</button>
    </div>
  </div>
</div>

<script type="module">
  import { stream } from "./ui/api.js";

  const log = document.getElementById("chat-log");
  const input = document.getElementById("chat-input");

  function append(kind, text) {
    const div = document.createElement("div");
    div.style.cssText = kind === "user"
      ? "align-self:flex-end;background:var(--accent);color:#fff;padding:8px 12px;border-radius:10px;max-width:75%;white-space:pre-wrap"
      : "align-self:flex-start;background:var(--bg-hover);padding:8px 12px;border-radius:10px;max-width:75%;white-space:pre-wrap";
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function thinking(text) {
    const div = document.createElement("div");
    div.className = "sub";
    div.style.cssText = "align-self:flex-start;font-style:italic;padding:2px 12px";
    div.textContent = text;
    log.appendChild(div);
    return div;
  }

  function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    append("user", text);
    const reply = append("assistant", "");
    let current = null;
    try {
      stream("/api/chat", { model: "", messages: [{ role: "user", content: text }] }, {
        onEvent: (ev) => {
          if (ev.reasoning && !current) current = thinking("💭 " + ev.reasoning);
          if (ev.delta) {
            reply.textContent = ev.type === "error" ? "⚠️ " + ev.delta : reply.textContent + ev.delta;
            if (current) current.remove();
            log.scrollTop = log.scrollHeight;
          }
        },
        onError: (exc) => { reply.textContent = "⚠️ " + exc.message; },
      });
    } catch (exc) {
      reply.textContent = "⚠️ " + exc.message;
    }
  }

  document.getElementById("chat-send").addEventListener("click", send);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
