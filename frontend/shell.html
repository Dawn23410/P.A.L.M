<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P.A.L.M</title>
<link rel="stylesheet" href="./ui/theme.css" />
<link rel="stylesheet" href="./ui/base.css" />
<style>
  /* 外壳专属布局（其余样式全部走 ui/） */
  .nav .logo small { display: block; font-size: 11px; color: var(--text-sub); font-weight: 400; }
  .content { max-width: 1080px; }
  .nav-foot { margin-top: 18px; font-size: 11px; color: var(--text-sub); padding: 0 8px; }
</style>
</head>
<body>
<div class="shell">
  <nav class="nav">
    <div class="logo">P.A.L.M<small>palm 库控制台</small></div>
    <div id="nav-links"></div>
    <div class="nav-foot">界面 = 模块 · 原生 ES Modules<br/>契约：UiPort</div>
  </nav>
  <main class="main">
    <div id="screen-root"><div class="sub">正在装载…</div></div>
  </main>
</div>

<script type="module">
  import { mountScreen } from "./ui/router.js";

  // 界面清单（顺序即导航顺序）；后端 HTTP 适配层未就绪时各界面按契约降级展示。
  const SCREENS = [
    { name: "overview",   label: "总览" },
    { name: "chat",       label: "对话" },
    { name: "characters", label: "角色卡" },
    { name: "game",       label: "游戏生态" },
    { name: "memory",     label: "记忆" },
    { name: "files",      label: "文件" },
    { name: "scheduler",  label: "定时任务" },
    { name: "usage",      label: "Token 用量" },
    { name: "monitor",    label: "运行监控" },
    { name: "mcp",        label: "MCP 工具台" },
    { name: "settings",   label: "应用设置" },
  ];

  const root = document.getElementById("screen-root");
  const links = document.getElementById("nav-links");
  let currentCleanup = () => {};

  function activate(name) {
    links.querySelectorAll("a").forEach((a) =>
      a.classList.toggle("active", a.dataset.screen === name));
    currentCleanup();
    currentCleanup = mountScreen(root, name);
    history.replaceState(null, "", "#" + name);
  }

  links.innerHTML = SCREENS.map((s) =>
    `<a href="#${s.name}" data-screen="${s.name}">${s.label}</a>`).join("");
  links.querySelectorAll("a").forEach((a) =>
    a.addEventListener("click", (e) => { e.preventDefault(); activate(a.dataset.screen); }));

  const initial = (location.hash || "#overview").slice(1);
  activate(SCREENS.some((s) => s.name === initial) ? initial : "overview");
  window.addEventListener("hashchange", () => {
    const name = location.hash.slice(1);
    if (SCREENS.some((s) => s.name === name)) activate(name);
  });
</script>
</body>
</html>
