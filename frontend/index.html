<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>P.A.L.M 控制台</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0f1115; color: #e6e8eb; padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8b929c; font-size: 13px; margin-bottom: 18px; }
  .bar { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .pill {
    background: #1b1f27; border: 1px solid #2a2f3a; border-radius: 999px;
    padding: 6px 14px; font-size: 13px;
  }
  .pill b { color: #6ee7a8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card {
    background: #161a21; border: 1px solid #262c38; border-radius: 10px; padding: 14px;
    transition: border-color .15s;
  }
  .card:hover { border-color: #3b82f6; }
  .card .name { font-weight: 600; font-size: 14px; }
  .card .title { color: #9aa3af; font-size: 12px; margin-top: 4px; min-height: 16px; }
  .card .bus {
    display: inline-block; margin-top: 8px; font-size: 11px; padding: 2px 8px;
    border-radius: 6px; background: #21304a; color: #7fb0ff;
  }
  .card .noapi { background: #3a2a2a; color: #ff9b9b; }
  .err { color: #ff8080; }
  button.refresh {
    background: #2563eb; color: #fff; border: none; border-radius: 8px;
    padding: 8px 16px; cursor: pointer; font-size: 13px;
  }
  button.refresh:hover { background: #1d4ed8; }
</style>
</head>
<body>
  <h1>P.A.L.M 控制台</h1>
  <div class="sub">主板 FastAPI 网关 · 物理解耦砖块 · 实时状态</div>

  <div class="bar">
    <button class="refresh" onclick="loadAll()">刷新</button>
    <span class="pill" id="health">健康：<b>检测中…</b></span>
    <span class="pill" id="count">砖块：<b>—</b></span>
    <span class="pill" id="api">已挂载路由：<b>—</b></span>
  </div>

  <div class="grid" id="grid"><div class="sub">加载中…</div></div>

  <script>
    const BASE = "";  // 同源：前端由主板 FastAPI 直接托管

    async function loadHealth() {
      try {
        const r = await fetch(BASE + "/health");
        const j = await r.json();
        document.getElementById("health").innerHTML =
          "健康：<b>" + (j.status === "ok" ? "正常" : j.status) + "</b>";
        document.getElementById("count").innerHTML = "砖块：<b>" + j.bricks_registered + "</b>";
        document.getElementById("api").innerHTML =
          "已挂载路由：<b>" + (j.brick_routers_mounted + j.mainboard_routers_mounted) + "</b>";
        return j;
      } catch (e) {
        document.getElementById("health").innerHTML = "健康：<b class='err'>不可达</b>";
        return null;
      }
    }

    async function loadBricks() {
      const grid = document.getElementById("grid");
      try {
        const r = await fetch(BASE + "/api/bricks");
        const j = await r.json();
        if (!j.bricks || !j.bricks.length) {
          grid.innerHTML = "<div class='sub'>无已注册砖块</div>";
          return;
        }
        grid.innerHTML = j.bricks.map(b => {
          const cls = b.has_router ? "bus" : "bus noapi";
          const tip = b.has_router ? b.bus : b.bus + " · 无 HTTP 路由";
          return "<div class='card'><div class='name'>" + escapeHtml(b.name) +
                 "</div><div class='title'>" + escapeHtml(b.title || "") +
                 "</div><span class='" + cls + "'>" + escapeHtml(tip) + "</span></div>";
        }).join("");
      } catch (e) {
        grid.innerHTML = "<div class='err'>加载砖块失败：" + escapeHtml(e.message) + "</div>";
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function loadAll() { await loadHealth(); await loadBricks(); }
    loadAll();
    setInterval(loadAll, 5000);
  </script>
</body>
</html>
