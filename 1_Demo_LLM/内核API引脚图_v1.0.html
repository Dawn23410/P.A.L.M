<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>内核 API 引脚图 · palm_llm + palm_cryptokernel</title>
<style>
:root{
  --bg:#16181d; --panel:#1d2026; --panel2:#23272e; --line:#333842; --line2:#454b57;
  --fg:#e6e8ec; --fg2:#a9b0bb; --fg3:#7b838f;
  --pwr:#4ec9a8; --in:#6aa9f0; --out:#8bc34a; --io:#b48ef0; --clk:#e0a458; --gnd:#f07b7b;
  --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
  --sans:ui-sans-serif,"Segoe UI","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f5; --line:#dfe3ea; --line2:#c8ced8;
    --fg:#1c1f24; --fg2:#4d5561; --fg3:#77808d;
    --pwr:#0f6e56; --in:#185fa5; --out:#3b6d11; --io:#534ab7; --clk:#854f0b; --gnd:#a32d2d;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.6}
a{color:var(--in)}
code,.sig,.pinno{font-family:var(--mono)}
header{padding:22px 26px 16px;border-bottom:1px solid var(--line)}
h1{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:.2px}
.sub{color:var(--fg2);font-size:12.5px}
.stats{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap}
.stat b{display:block;font-size:20px;font-weight:600;font-family:var(--mono)}
.stat span{color:var(--fg3);font-size:11.5px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
input[type=search]{flex:0 0 260px;padding:7px 10px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);font-size:12.5px;font-family:var(--sans)}
.tabs{display:flex;gap:6px}
.tab{padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--fg2);cursor:pointer;font-size:12.5px}
.tab.on{background:var(--panel2);color:var(--fg);border-color:var(--line2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto}
.lg{display:flex;align-items:center;gap:5px;color:var(--fg2);font-size:11.5px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}
section{padding:20px 26px 6px}
h2{font-size:15px;margin:6px 0 12px;font-weight:600}
.chipwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:980px){.chipwrap{grid-template-columns:minmax(0,1fr)}}
.chipcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.chipcard h3{margin:0 0 2px;font-size:14px}
.chipcard .meta{color:var(--fg3);font-size:11.5px;margin-bottom:8px}
svg.chip{width:100%;height:auto;display:block;cursor:crosshair}
.bankbtn{cursor:pointer}
.bankbtn:hover rect.bankbody{fill:var(--panel2)}
.banktable{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 16px;overflow:hidden}
.bankhead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.bankhead .tag{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--fg2)}
.bankhead .ttl{font-weight:600;font-size:13.5px}
.bankhead .cnt{margin-left:auto;color:var(--fg3);font-size:11.5px;font-family:var(--mono)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--fg3);font-size:11.5px;background:var(--panel2)}
tr:last-child td{border-bottom:none}
td.no{width:52px;font-family:var(--mono);color:var(--fg3);font-size:11.5px}
td.nm{width:190px;font-family:var(--mono);font-size:12px;word-break:break-all}
td.sg{width:31%;font-family:var(--mono);font-size:11.5px;color:var(--fg2);word-break:break-word}
td.kd{width:74px}
td.no2{width:56px}
.kbadge{font-size:10.5px;padding:1px 6px;border-radius:4px;font-family:var(--mono);white-space:nowrap}
.k-PWR{background:color-mix(in srgb,var(--pwr) 20%,transparent);color:var(--pwr)}
.k-IN{background:color-mix(in srgb,var(--in) 20%,transparent);color:var(--in)}
.k-OUT{background:color-mix(in srgb,var(--out) 20%,transparent);color:var(--out)}
.k-IO{background:color-mix(in srgb,var(--io) 20%,transparent);color:var(--io)}
.k-CLK{background:color-mix(in srgb,var(--clk) 20%,transparent);color:var(--clk)}
.k-GND{background:color-mix(in srgb,var(--gnd) 20%,transparent);color:var(--gnd)}
.sig{cursor:copy}
.sig:hover{color:var(--fg)}
tr.hit{background:color-mix(in srgb,var(--clk) 10%,transparent)}
footer{padding:18px 26px 40px;color:var(--fg3);font-size:11.5px;border-top:1px solid var(--line);margin-top:14px}
.note{color:var(--fg3);font-size:11.5px;font-weight:400;margin-left:6px}
</style>
</head>
<body>
<header>
  <h1>内核 API 引脚图</h1>
  <div class="sub">芯片 = 模块（封装）· 引脚 = 对外 API（签名 / 方向 / 说明）。两个内核均为「内嵌独立项目」，引脚清单由源码 AST 抽取 + 运行时能力矩阵核对，非手抄。</div>
  <div class="stats" id="stats"></div>
</header>

<div class="toolbar">
  <input id="q" type="search" placeholder="搜引脚名 / 签名 / 说明（如 digest、stream、boot）">
  <div class="tabs" id="tabs"></div>
  <div class="legend" id="legend"></div>
</div>

<section>
  <h2>芯片封装视图</h2>
  <div class="chipwrap" id="chips"></div>
</section>

<section>
  <h2>引脚明细</h2>
  <div id="banks"></div>
</section>

<footer id="src"></footer>

<script>
const KIND = {
  PWR: {cn: "电源 · 装配 / 生命周期"},
  IN:  {cn: "输入 · 配置 / 入参"},
  OUT: {cn: "输出 · 返回值"},
  IO:  {cn: "双向 · 结构体 / 状态"},
  CLK: {cn: "时钟 · 流式 / 计时"},
  GND: {cn: "地 · 异常 / 降级兜底"}
};

const CHIPS = [
{
  ref: "U1", id: "llm", pkg: "palm_llm", cn: "LLM 内核",
  meta: "多厂商大模型统一流式调用层 · 四协议通道（openai_compat / anthropic / ollama / gemini）· 服务端 FastAPI :10083",
  banks: [
    { id:"facade", cn:"包门面", note:"from palm_llm import …（__init__.py 的 __all__）", pins:[
      {n:"A1",x:"Message",s:"class Message",k:"IO",d:"对话消息：role/content/images/files/tool_calls/tool_call_id/name/tool_error/reasoning/reasoning_echo"},
      {n:"A2",x:"ModelParameters",s:"class ModelParameters",k:"IN",d:"生成参数：temperature/top_p/max_tokens/两条 penalty/extra_body/tools/tool_choice/parallel_tool_calls"},
      {n:"A3",x:"ProviderConfig",s:"class ProviderConfig",k:"IN",d:"连接配置：name/type/base_url/api_key/default_model/extra/retry"},
      {n:"A4",x:"Tool",s:"class Tool",k:"IO",d:"函数工具声明：name/description/parameters(JSON Schema)/raw/strict"},
      {n:"A5",x:"BaseProvider",s:"class BaseProvider",k:"IO",d:"所有提供方的统一接口基类（含客户端复用与预热）"},
      {n:"A6",x:"OpenAICompatProvider",s:"class OpenAICompatProvider",k:"OUT",d:"默认通道：OpenAI 兼容端点（覆盖绝大多数厂商与网关）"},
      {n:"A7",x:"OllamaProvider",s:"class OllamaProvider",k:"OUT",d:"本地 ollama 原生 /api/chat 通道"},
      {n:"A8",x:"OLLAMA_DEFAULT_BASE_URL",s:"const str",k:"OUT",d:"本地 ollama 默认根地址（注意：不带 /v1）"},
      {n:"A9",x:"capabilities_for",s:"def capabilities_for(base_url=\"\", type_hint=\"\", model=\"\") -> dict",k:"OUT",d:"查「端点+模型」能力矩阵，供预检或 UI 提示"},
      {n:"A10",x:"get_provider_instance",s:"def get_provider_instance(cfg) -> BaseProvider",k:"OUT",d:"按 cfg.type 取 provider；未知 type 回落 openai_compat"},
      {n:"A11",x:"RetryPolicy",s:"class RetryPolicy",k:"IN",d:"重试策略（不可变）；ProviderConfig.retry 选择"},
      {n:"A12",x:"LOW_LATENCY",s:"const RetryPolicy",k:"IN",d:"默认档：最多重试 1 次、不退避（与既有行为一致）"},
      {n:"A13",x:"STABLE",s:"const RetryPolicy",k:"IN",d:"企业档：3 次 + 指数退避 + 抖动"},
      {n:"A14",x:"configure_logging",s:"def configure_logging(level=None, stream=None) -> logging.Logger",k:"PWR",d:"幂等装配：结构化格式 + 队列异步输出"},
      {n:"A15",x:"get_request_id",s:"def get_request_id() -> str",k:"OUT",d:"取本次请求 id（contextvars 跨 await 贯通）"},
      {n:"A16",x:"set_request_id",s:"def set_request_id(rid) -> contextvars.Token",k:"IN",d:"服务层在回合边界设置；空值则新生成"},
      {n:"A17",x:"CapabilityError",s:"class CapabilityError(PalmLLMError)",k:"GND",d:"输入超出目标模型能力 —— 发请求前拦截（零网络往返）"},
      {n:"A18",x:"PalmLLMError",s:"class PalmLLMError(RuntimeError)",k:"GND",d:"全部异常的基类；继承 RuntimeError 以兼容既有兜底"},
      {n:"A19",x:"TransportError",s:"class TransportError(PalmLLMError)",k:"GND",d:"传输层失败（重置/超时/DNS/首字节超时）—— 可重试"},
      {n:"A20",x:"UpstreamServerError",s:"class UpstreamServerError(PalmLLMError)",k:"GND",d:"上游 5xx —— 可重试但有界"},
      {n:"A21",x:"RateLimitError",s:"class RateLimitError(PalmLLMError)",k:"GND",d:"429 —— 可重试且必须尊重 Retry-After"},
      {n:"A22",x:"AuthError",s:"class AuthError(PalmLLMError)",k:"GND",d:"401/403 —— 不可重试"},
      {n:"A23",x:"BadRequestError",s:"class BadRequestError(PalmLLMError)",k:"GND",d:"4xx 参数/语义错误 —— 不可重试"},
      {n:"A24",x:"NotConfiguredError",s:"class NotConfiguredError(PalmLLMError)",k:"GND",d:"本地配置缺失（如未填 API Key）—— 不可重试"},
      {n:"A25",x:"StreamInterruptedError",s:"class StreamInterruptedError(PalmLLMError)",k:"GND",d:"已向调用方产出内容后中断 —— 绝不重试（否则重复计费）"}
    ]},
    { id:"providers-facade", cn:"providers 门面", note:"from palm_llm.providers import …（其余导出）", pins:[
      {n:"B1",x:"AnthropicProvider",s:"class AnthropicProvider(BaseProvider)",k:"OUT",d:"原生 /v1/messages：system 外提、块级 SSE、缓存 token、effort 档"},
      {n:"B2",x:"GeminiProvider",s:"class GeminiProvider(BaseProvider)",k:"OUT",d:"原生 generateContent：user/model 两角色、parts[]、x-goog-api-key、无 [DONE]"},
      {n:"B3",x:"GEMINI_DEFAULT_BASE_URL",s:"const str",k:"OUT",d:"Gemini 默认端点基址"},
      {n:"B4",x:"Meter",s:"class Meter",k:"CLK",d:"一次请求的计时/计数累加器（流式与非流式共用）"},
      {n:"B5",x:"TurnStats",s:"class TurnStats",k:"CLK",d:"跨协议归一的回传统一字段（新代码只读它）"},
      {n:"B6",x:"check_capabilities",s:"def check_capabilities(messages, profile, model=\"\", provider=\"\", rule=None) -> dict",k:"OUT",d:"按能力矩阵校验入参；违规抛 CapabilityError"}
    ]},
    { id:"models", cn:"数据模型", note:"palm_llm/models.py —— 内核与调用方之间的稳定结构", pins:[
      {n:"C1",x:"ProviderConfig.fields",s:"name, type=\"openai_compat\", base_url, api_key, default_model, extra, retry",k:"IN",d:"type 决定通道：openai_compat / anthropic / ollama / gemini"},
      {n:"C2",x:"Message.fields",s:"role, content, images, files, tool_calls, tool_call_id, name, tool_error, reasoning, reasoning_echo",k:"IO",d:"files 与 images 同形态（str data URI 或 {data,mime,name,size}）"},
      {n:"C3",x:"Message.to_openai",s:"def to_openai(self) -> dict",k:"OUT",d:"多模态时改走 content blocks；纯附件消息不塞空文本块"},
      {n:"C4",x:"Tool.fields",s:"name, description, parameters, raw, strict",k:"IO",d:"raw 可直接透传已组装好的 OpenAI 结构"},
      {n:"C5",x:"Tool.to_openai",s:"def to_openai(self) -> dict",k:"OUT",d:"输出 {type:function, function:{name,description,parameters}}"},
      {n:"C6",x:"Tool.normalize",s:"@staticmethod normalize(tools) -> Optional[list[dict]]",k:"IO",d:"list[Tool] / list[dict] 统一为 OpenAI tools 数组"},
      {n:"C7",x:"ModelParameters.fields",s:"temperature=0.7, top_p=1.0, max_tokens=8192, frequency_penalty, presence_penalty, extra_body, tools, tool_choice, parallel_tool_calls",k:"IN",d:"max_tokens 默认 8192：思考链会吃掉数千 token，过小会让 content 为空"}
    ]},
    { id:"base", cn:"提供方基类", note:"palm_llm/providers/base.py —— 复用客户端 / SSE / 工具归一", pins:[
      {n:"D1",x:"get_client",s:"def get_client() -> httpx.AsyncClient",k:"PWR",d:"按事件循环对象身份复用的异步客户端（HTTP/2 + 连接池 + 保活）"},
      {n:"D2",x:"close_client",s:"async def close_client() -> None",k:"PWR",d:"程序退出时优雅关闭所有客户端"},
      {n:"D3",x:"FirstByteTimeout",s:"class FirstByteTimeout(TransportError)",k:"GND",d:"首字节等待超时（连接可能已被服务端关闭，应换连接重试）"},
      {n:"D4",x:"chain",s:"async def chain(first, rest)",k:"CLK",d:"把已取出的首行与其余行拼成一条异步流"},
      {n:"D5",x:"iter_sse_lines",s:"async def iter_sse_lines(resp)",k:"CLK",d:"逐行产出 SSE/NDJSON；首字节短超时内未到达则抛 FirstByteTimeout"},
      {n:"D6",x:"to_chat_message",s:"def to_chat_message(m, echo_reasoning=False) -> dict",k:"OUT",d:"Message 归一为厂商 payload；思考块默认**不发**（误发会让必须剥离的厂商静默 400）"},
      {n:"D7",x:"normalize_tool_calls",s:"def normalize_tool_calls(raw) -> Optional[list[dict]]",k:"OUT",d:"任意来源的 tool_calls 归一为内核口径（三通道共用一份）"},
      {n:"D8",x:"BaseProvider.__init__",s:"def __init__(self, cfg)",k:"IN",d:"持有 ProviderConfig"},
      {n:"D9",x:"BaseProvider.complete",s:"async def complete(self, messages, params, model, stream=True)",k:"CLK",d:"产出增量字典：content / reasoning / tool_call_delta / tool_calls / done+usage+stats"},
      {n:"D10",x:"BaseProvider.prewarm",s:"async def prewarm(self) -> float",k:"PWR",d:"预建 TCP+TLS 连接入池，把握手移出首字关键路径"},
      {n:"D11",x:"BaseProvider.image_to_b64",s:"async def image_to_b64(self, url)",k:"IN",d:"图片 URL → (media_type, base64)；支持 data URI 与远程 http(s)"}
    ]},
    { id:"channels", cn:"四通道适配", note:"每条通道一个 provider；协议结构差异走薄适配器", pins:[
      {n:"E1",x:"OpenAICompat.complete",s:"async def complete(self, messages, params, model, stream=True)",k:"CLK",d:"三级容错：完整格式 → 400/404/415/422 降级为基础字段子集重试 → 再失败抛错"},
      {n:"E2",x:"Anthropic.complete",s:"async def complete(self, messages, params, model, stream=True)",k:"CLK",d:"原生 /v1/messages（x-api-key + anthropic-version）"},
      {n:"E3",x:"NATIVE_VERSION",s:"const str",k:"OUT",d:"Anthropic 原生 API 版本号"},
      {n:"E4",x:"Ollama.complete",s:"async def complete(self, messages, params, model, stream=True)",k:"CLK",d:"原生 /api/chat；think 是一等参数，思维链在 message.thinking"},
      {n:"E5",x:"Ollama.prewarm",s:"async def prewarm(self) -> float",k:"PWR",d:"GET /api/tags 预建连（父类打的是 OpenAI 风格 /models）"},
      {n:"E6",x:"Ollama.list_models",s:"async def list_models() -> list[str]",k:"OUT",d:"已安装模型列表；失败返回空列表（供 UI/CLI 展示）"},
      {n:"E7",x:"DEFAULT_BASE_URL",s:"const str（ollama / gemini 各一）",k:"OUT",d:"各通道默认端点"},
      {n:"E8",x:"Gemini.complete",s:"async def complete(self, messages, params, model, stream=True)",k:"CLK",d:"原生 generateContent；无 [DONE]，靠连接关闭收尾"}
    ]},
    { id:"wire", cn:"协议线（wire）", note:"anthropic_wire / gemini_wire —— 结构差异无法用数据表达，故单独成薄文件", pins:[
      {n:"F1",x:"to_native_messages",s:"async def to_native_messages(messages, fetch_image, echo_reasoning=False) -> tuple[str, list[dict]]",k:"IO",d:"Anthropic：(system 文本, 原生 messages)"},
      {n:"F2",x:"native_tools",s:"def native_tools(tools) -> Optional[list]",k:"IO",d:"parameters 改名 input_schema"},
      {n:"F3",x:"native_tool_choice",s:"def native_tool_choice(choice, parallel=None) -> Optional[dict]",k:"IN",d:"原生无 required → 映射为 any；disallow parallel 走 disable_parallel_tool_use"},
      {n:"F4",x:"anthropic.new_state",s:"def new_state() -> dict",k:"IO",d:"累积器：usage / 工具槽位 / 思考签名 / 停止原因 / 原生块序列"},
      {n:"F5",x:"anthropic.on_event",s:"def on_event(st, obj, name) -> list",k:"CLK",d:"一个原生流式事件 → 内核事件列表"},
      {n:"F6",x:"content_events",s:"def content_events(blocks, st) -> list",k:"OUT",d:"非流式 content blocks → 事件（思考在正文之前）"},
      {n:"F7",x:"finish_events",s:"def finish_events(st, meter) -> list[dict]",k:"CLK",d:"收尾帧：完整工具调用 + done（原始 usage + 归一 stats）"},
      {n:"F8",x:"parse_sse",s:"def parse_sse(line) -> Optional[dict]",k:"IN",d:"解析一行 SSE"},
      {n:"F9",x:"error_text",s:"def error_text(raw) -> str",k:"GND",d:"错误体优先取 error.message"},
      {n:"F10",x:"SIG_SEP",s:"const str",k:"OUT",d:"思考签名分隔约定"},
      {n:"F11",x:"to_contents",s:"async def to_contents(messages, fetch_image, echo_reasoning=False)",k:"IO",d:"Gemini：(system 文本, 原生 contents)"},
      {n:"F12",x:"function_declarations",s:"def function_declarations(tools) -> Optional[list]",k:"IO",d:"参数 Schema 近似 OpenAPI 3.0，可直接搬"},
      {n:"F13",x:"tool_config",s:"def tool_config(choice, parallel=None) -> Optional[dict]",k:"IN",d:"→ toolConfig.functionCallingConfig"},
      {n:"F14",x:"events_from",s:"def events_from(chunk, st, name) -> list[dict]",k:"CLK",d:"一帧或整包 → 内核事件列表"},
      {n:"F15",x:"finish_reason",s:"def finish_reason(raw, has_calls) -> str",k:"OUT",d:"原生 finishReason → OpenAI 口径"}
    ]},
    { id:"cap", cn:"能力矩阵", note:"palm_llm/providers/capability.py —— 发请求前的闸门", pins:[
      {n:"G1",x:"capabilities_for",s:"def capabilities_for(base_url=\"\", type_hint=\"\", model=\"\") -> dict",k:"OUT",d:"端点 + 模型 → 能力矩阵"},
      {n:"G2",x:"check_capabilities",s:"def check_capabilities(messages, profile, model=\"\", provider=\"\", rule=None) -> dict",k:"OUT",d:"三条铁律：只拦已知不支持 / 只看内核 Message / 报错可照着改"}
    ]},
    { id:"profiles", cn:"方言与规则", note:"palm_llm/providers/profiles.py —— 一级定骨架、二级定语义参数", pins:[
      {n:"H1",x:"Profile",s:"class Profile",k:"IO",d:"供应商级方言（一级匹配命中后生效）"},
      {n:"H2",x:"ModelRule",s:"class ModelRule",k:"IO",d:"模型级规则（二级匹配命中后生效）；可覆盖思考回传等开关"},

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let filterChip = "all", query = "";

function allPins(chip){ return chip.banks.flatMap(b => b.pins.map(p => ({...p, bank:b}))); }

function totalPins(){ return CHIPS.reduce((a,c) => a + allPins(c).length, 0); }
function totalBanks(){ return CHIPS.reduce((a,c) => a + c.banks.length, 0); }

function renderStats(){
  const u2matrix = CHIPS[1].banks.find(b => b.id === "matrix");
  const rows = [
    [String(CHIPS.length), "内核（芯片封装）"],
    [String(totalBanks()), "引脚组（bank）"],
    [String(totalPins()), "引脚（对外 API）"],
    ["4", "协议通道（U1）"],
    [String(u2matrix.pins.length), "算法（U2 运行时实测）"],
    ["AST", "抽取方式（非手抄）"]
  ];
  document.getElementById("stats").innerHTML = rows
    .map(r => '<div class="stat"><b>' + esc(r[0]) + '</b><span>' + esc(r[1]) + '</span></div>').join("");
}

function renderLegend(){
  document.getElementById("legend").innerHTML = Object.entries(KIND)
    .map(([k,v]) => '<span class="lg"><i class="dot" style="background:var(--' + k.toLowerCase() + ')"></i>' + esc(k + " · " + v.cn) + '</span>').join("");
}

function renderTabs(){
  const tabs = [{id:"all", cn:"全部"}, ...CHIPS.map(c => ({id:c.id, cn:c.ref + " · " + c.cn}))];
  document.getElementById("tabs").innerHTML = tabs
    .map(t => '<button class="tab' + (filterChip === t.id ? " on" : "") + '" data-id="' + esc(t.id) + '">' + esc(t.cn) + '</button>').join("");
  document.querySelectorAll(".tab").forEach(el => el.onclick = () => {
    filterChip = el.dataset.id; renderTabs(); applyFilter();
  });
}

function chipSvg(chip){
  const left = [], right = [];
  chip.banks.forEach((b, i) => (i % 2 === 0 ? left : right).push(b));
  const rows = Math.max(left.length, right.length);
  const rowH = 26, top = 62, pinLen = 26;
  const bodyW = 300, bodyX = 40 + pinLen + 34, W = 680;
  const H = top + rows * rowH + 46;
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img">';
  s += '<title>' + esc(chip.ref + " " + chip.pkg) + '</title>';
  s += '<desc>' + esc(chip.cn + " 的模块封装与引脚组分布") + '</desc>';
  s += '<rect x="' + bodyX + '" y="26" width="' + bodyW + '" height="' + (H - 60) + '" rx="12" fill="var(--panel2)" stroke="var(--line2)" stroke-width="1"/>';
  s += '<text x="' + (bodyX + 14) + '" y="48" fill="var(--fg)" font-size="14" font-weight="600">' + esc(chip.ref + "  " + chip.pkg) + '</text>';
  s += '<text x="' + (bodyX + bodyW - 14) + '" y="48" text-anchor="end" fill="var(--fg3)" font-size="11">' + esc(chip.cn + " · " + allPins(chip).length + " 引脚") + '</text>';
  const draw = (list, side) => list.map((b, i) => {
    const y = top + i * rowH + 10;
    const pinX = side === "L" ? 40 : W - 40;
    const stubEnd = side === "L" ? 40 + pinLen : W - 40 - pinLen;
    const labelX = side === "L" ? bodyX + 14 : bodyX + bodyW - 14;
    const anchor = side === "L" ? "start" : "end";
    const dot = KIND[b.pins[0] ? b.pins[0].k : "IO"];
    const t = '<g class="bankbtn" data-bank="' + esc(chip.id + "-" + b.id) + '">'
      + '<line x1="' + pinX + '" y1="' + y + '" x2="' + stubEnd + '" y2="' + y + '" stroke="var(--line2)" stroke-width="2"/>'
      + '<circle cx="' + pinX + '" cy="' + y + '" r="4" fill="var(--' + (b.pins[0] ? b.pins[0].k.toLowerCase() : "io") + ')"/>'
      + '<text x="' + labelX + '" y="' + (y + 4) + '" text-anchor="' + anchor + '" fill="var(--fg2)" font-size="12">'
      + esc(b.cn + "  ×" + b.pins.length) + '</text>'
      + '<title>' + esc(b.cn + "：" + b.pins.length + " 个引脚，点击跳到明细") + '</title></g>';
    return t;
  }).join("");
  s += draw(left, "L") + draw(right, "R");
  s += '<text x="40" y="' + (H - 14) + '" fill="var(--fg3)" font-size="11">' + esc(chip.meta) + '</text>';
  s += '</svg>';
  return s;
}

function renderChips(){
  document.getElementById("chips").innerHTML = CHIPS.map(c =>
    '<div class="chipcard"><h3>' + esc(c.ref + " · " + c.pkg) + ' <span class="note">' + esc(c.cn) + '</span></h3>'
    + '<div class="meta">' + esc(c.banks.length + " 个引脚组 · " + allPins(c).length + " 个引脚") + '</div>'
    + chipSvg(c) + '</div>').join("");
  document.querySelectorAll(".bankbtn").forEach(el => el.onclick = () => {
    const id = el.dataset.bank;
    const sec = document.getElementById(id);
    if (sec) { sec.scrollIntoView({behavior:"smooth", block:"center"}); flash(id); }
  });
}

function flash(id){
  const el = document.getElementById(id);
  el.style.transition = "box-shadow .4s";
  el.style.boxShadow = "0 0 0 2px var(--clk)";
  setTimeout(() => el.style.boxShadow = "none", 900);
}

function rowHtml(id, p){
  const k = p.k || "IO";
  return '<tr data-key="' + esc((p.x + " " + p.s + " " + p.d + " " + p.n).toLowerCase()) + '">'
    + '<td class="no">' + esc(p.n) + '</td>'
    + '<td class="nm">' + esc(p.x) + '</td>'
    + '<td class="sg"><span class="sig" title="点击复制签名">' + esc(p.s) + '</span></td>'
    + '<td class="kd"><span class="kbadge k-' + k + '">' + esc(k) + '</span></td>'
    + '<td>' + esc(p.d) + '</td></tr>';
}

function renderBanks(){
  let html = "";
  for (const c of CHIPS) {
    html += '<h2 style="margin-top:18px">' + esc(c.ref + " · " + c.pkg + " — " + c.cn) + '</h2>';
    for (const b of c.banks) {
      const id = c.id + "-" + b.id;
      html += '<div class="banktable" id="' + esc(id) + '" data-chip="' + esc(c.id) + '">'
        + '<div class="bankhead" onclick="var t=this.nextElementSibling;t.style.display=t.style.display===\'none\'?\'\':\'none\'">'
        + '<span class="tag">' + esc(c.ref + "." + b.id) + '</span>'
        + '<span class="ttl">' + esc(b.cn) + '</span>'
        + (b.note ? '<span class="note">' + esc(b.note) + '</span>' : '')
        + '<span class="cnt">' + esc(b.pins.length + " pins") + '</span></div>'
        + '<table><thead><tr><th>引脚</th><th>名称</th><th>签名 / 形态</th><th>方向</th><th>说明</th></tr></thead><tbody>'
        + b.pins.map(p => rowHtml(id, p)).join("")
        + '</tbody></table></div>';
    }
  }
  document.getElementById("banks").innerHTML = html;
  document.querySelectorAll(".sig").forEach(el => el.onclick = () => {
    const t = el.textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t);
    el.style.color = "var(--clk)";
    setTimeout(() => el.style.color = "", 500);
  });
}

function applyFilter(){
  const q = query.trim().toLowerCase();
  document.querySelectorAll(".banktable").forEach(box => {
    const chipOk = filterChip === "all" || box.dataset.chip === filterChip;
    let shown = 0;
    box.querySelectorAll("tbody tr").forEach(tr => {
      const hit = chipOk && (!q || tr.dataset.key.indexOf(q) >= 0);
      if (q) tr.classList.toggle("hit", hit);
      tr.style.display = hit ? "" : "none";
      if (hit) shown++;
    });
    box.style.display = shown ? "" : "none";
  });
}

function renderSrc(){
  const pins = totalPins();
  document.getElementById("src").innerHTML =
    "引脚清单由源码 AST 抽取（palm_llm/*.py、palm_cryptokernel/**/*.py 的公共 def/class 与其 __all__），"
    + "算法矩阵由 <code>palm_cryptokernel.capabilities.report()</code> 运行时实取（6 族 " + CHIPS[1].banks.find(b => b.id === "matrix").pins.length + " 条）。"
    + "共 " + pins + " 个引脚 · 数据日期 2026-09-23 · U2 版本 0.5.2 / U1 服务端 0.2.0。"
    + "点击任意签名可复制；点击封装图上的引脚组可跳到明细。";
}

renderStats(); renderLegend(); renderTabs(); renderChips(); renderBanks(); applyFilter(); renderSrc();
document.getElementById("q").addEventListener("input", e => { query = e.target.value; applyFilter(); });
</script>
</body>
</html>
