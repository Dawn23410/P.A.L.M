[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mentalcore"
version = "0.1.0"
description = "开源 AI 陪伴微核心：魔方（聊天）+ 工坊（干活）。纯聊天文本通道，无工具调用、非推理。"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "httpx>=0.27",
    "gmssl>=0.0.4",
    "pydantic>=2.0",
    "chromadb>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mentalcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
