# 统一护栏默认规则集（移植自原裁决引擎，规则模型见 palm_sdk.guardrail.rules）
# 设计原则：默认放行。仅在「危害系统完整性」或「大量删除」时才拦截，
# 普通文件读写、命令执行、网络请求、单文件删除均不弹窗、不拦截。
# 规则以 AND 逻辑组合条件；优先级越高（0~100）越先匹配；无匹配 → 按档位兜底。
#
# 响应动作：
#   deny  : 直接拒绝并报错（拦截）
#   ask   : 询问用户确认（会阻塞，非必要不使用）
#   allow : 静默放行（白名单）
#   warn  : 放行但记录告警
version: 1
rules:

  # ══════════════════════════════════════════════
  # 一、文件删除：仅系统路径 / 通配符大量删除拦截
  # ══════════════════════════════════════════════

  - id: file_delete_system_deny
    description: "删除系统关键路径直接拒绝"
    enabled: true
    priority: 100
    trigger: file.delete
    conditions:
      - field: path
        op: matches
        value: '^[A-Z]:[\\/](Windows|System32|Program Files|ProgramData)|^[/\\](etc|usr|bin|sbin|boot|dev|lib|opt|System|private)'
    actions:
      - deny: "AI 试图删除系统关键路径文件，已自动拒绝"

  - id: file_delete_mass_glob_deny
    description: "通配符/递归路径大量删除直接拒绝"
    enabled: true
    priority: 100
    trigger: file.delete
    conditions:
      - field: path
        op: matches
        value: '(\.\./|[\\/]\.\.|[*?]|[\\/]\*)'
    actions:
      - deny: "AI 试图用通配符/递归路径删除文件（{path}），已自动拒绝以防大量误删"

  # ══════════════════════════════════════════════
  # 二、文件写入：仅系统路径拦截（普通路径随意写）
  # ══════════════════════════════════════════════

  - id: file_write_system_deny
    description: "写入系统关键路径直接拒绝"
    enabled: true
    priority: 100
    trigger: file.write
    conditions:
      - field: path
        op: matches
        value: '^[A-Z]:[\\/](Windows|System32|Program Files|ProgramData)|^[/\\](etc|usr|bin|sbin|boot|lib|opt|System|private)'
    actions:
      - deny: "AI 试图写入系统关键路径 {path}，已自动拒绝"

  # ══════════════════════════════════════════════
  # 三、命令执行：仅破坏性 / 提权命令拦截（普通代码随意跑）
  # ══════════════════════════════════════════════

  - id: exec_destructive_deny
    description: "高危破坏性命令直接拒绝（rm -rf / format / dd / 磁盘工具 / 关机重启等）"
    enabled: true
    priority: 100
    trigger: process.execute
    conditions:
      - field: code
        op: matches
        value: '(\brm -rf[ /]|\brm -r /|\bdel /[FQS]|\bformat [A-Za-z]:|mkfs|wipefs|fdisk|DISKPART|dd if=|\bshutdown\b|\bpoweroff\b|\breboot\b|\bhalt\b|init 0|init 6|\bkill -9\b|\bpkill -f\b|:\(\)|reg delete|fsutil|> */dev/(sd|hd|nvme|vd|disk)|chmod 000 )'
    actions:
      - deny: "AI 试图执行高危破坏性命令，已自动拒绝"

  - id: exec_privilege_escalate_deny
    description: "提权或系统管理命令直接拒绝（sudo/su/chmod 777/passwd 等）"
    enabled: true
    priority: 100
    trigger: process.execute
    conditions:
      - field: code
        op: matches
        value: '^(sudo |su |chmod 777|chown |passwd |useradd |usermod |net user )'
    actions:
      - deny: "AI 试图执行提权或系统管理命令，已自动拒绝"

  # ══════════════════════════════════════════════
  # 四、低风险兜底白名单：避免 AI 兜底在无廉价模型时拦截正常工具
  # ══════════════════════════════════════════════

  - id: file_read_allow
    description: "普通文件读取直接放行"
    enabled: true
    priority: 1
    trigger: file.read
    conditions: []
    actions:
      - allow: "普通文件读取直接放行"

  - id: file_write_normal_allow
    description: "非系统路径文件写入直接放行"
    enabled: true
    priority: 1
    trigger: file.write
    conditions: []
    actions:
      - allow: "普通文件写入直接放行"

  - id: file_delete_normal_allow
    description: "非系统路径、非通配符单文件删除直接放行"
    enabled: true
    priority: 1
    trigger: file.delete
    conditions: []
    actions:
      - allow: "普通单文件删除直接放行"

  - id: process_execute_normal_allow
    description: "非破坏性、非提权命令直接放行"
    enabled: true
    priority: 1
    trigger: process.execute
    conditions: []
    actions:
      - allow: "普通命令执行直接放行"

  - id: network_request_allow
    description: "普通网络请求直接放行"
    enabled: true
    priority: 1
    trigger: network.request
    conditions: []
    actions:
      - allow: "普通网络请求直接放行"

  - id: desktop_control_allow
    description: "普通桌面控制直接放行"
    enabled: true
    priority: 1
    trigger: desktop.control
    conditions: []
    actions:
      - allow: "普通桌面控制直接放行"
