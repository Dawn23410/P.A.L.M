<div class="card">
  <div class="label">天气 · <span id="city">--</span></div>
  <div class="main">
    <div class="icon" id="icon">❓</div>
    <div class="temp"><span id="temp">--</span><span class="deg">°</span></div>
  </div>
  <div class="desc" id="desc">N/O</div>
  <div class="stats">
    <div class="stat"><span class="k">体感</span><span class="v" id="feels">--°</span></div>
    <div class="stat"><span class="k">湿度</span><span class="v" id="hum">--%</span></div>
    <div class="stat"><span class="k">风速</span><span class="v" id="sub">-- km/h</span></div>
  </div>
</div>
