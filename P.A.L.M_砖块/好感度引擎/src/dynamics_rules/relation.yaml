# 关系型动态规则：随好感度档位跨越触发的运行时身份/心境变化。
# trigger 等于好感度档名时命中；同 kind 多命中取 priority 最大。
rules:
  - kind: relation
    id: close_title
    when: 好感度到达「亲近」档
    trigger: 亲近
    priority: 5
    overlay: "（关系进展）你们的关系已明显亲近，你更自然地流露依赖。"
  - kind: relation
    id: intimate_title
    when: 好感度到达「亲密」档
    trigger: 亲密
    priority: 10
    overlay: "（关系里程碑）你们已亲密无间，你以更私密的口吻与对方相处。"
