# brick.yaml — 声卡 扩展卡（PCIe facade）
name: soundcard
title: "声卡"
description: >
  PCIe 扩展卡：统一管理 声纹识别 / 语音识别 / 语音合成(GPT-SoVITS) /
  语音合成(CosyVoice) 四个独立音频引擎。本砖不跑引擎，只聚合四者的运行态
  （加载/就绪）并提供统一管控面 /api/soundcard/status，便于主板 BIOS 与前端
  把音频子系统当作「一张卡」来查看。各引擎能力键仍归各自所有，本砖零重复注册。
is_core: false
bus_type: pcie
can_accept_files: false
enabled: true
# facade 砖：轻量聚合，进程内零开销，无重依赖，随主环境运行。
isolation: inproc
endpoint: inproc://
