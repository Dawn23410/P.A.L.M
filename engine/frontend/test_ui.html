<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 组件 · 真实 API 验证台</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0f1320; color: #e6e9ef;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.5;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: #161b2e; border-bottom: 1px solid #28304a;
    padding: 12px 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; }
  header .spacer { flex: 1; }
  select, button {
    font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #2f3a5c;
    background: #1d2540; color: #e6e9ef; cursor: pointer;
  }
  button.primary { background: #3b6cff; border-color: #3b6cff; color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .summary {
    font-size: 13px; color: #9aa3b2; padding: 8px 18px; border-bottom: 1px solid #1c2236;
    background: #12172a;
  }
  .summary b { color: #cfe0ff; }
  main { padding: 18px; max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }
  .case { background: #161b2e; border: 1px solid #28304a; border-radius: 12px; overflow: hidden; }
  .case-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #222a44; }
  .case-head h3 { margin: 0; font-size: 14px; flex: 1; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #233; color: #8fd; white-space: nowrap; }
  .meta { font-size: 12px; color: #8b94a8; padding: 6px 14px; display: flex; gap: 14px; flex-wrap: wrap; }
  .meta .ok { color: #6ee7a8; } .meta .err { color: #ff8a8a; } .meta .run { color: #ffd479; }
  .case ai-message { display: block; }
  .prompt-src {
    font-size: 11px; color: #6b7488; padding: 4px 14px 10px; white-space: pre-wrap;
    border-top: 1px dashed #222a44; margin-top: 6px; max-height: 120px; overflow: auto;
  }
  .bar { height: 6px; background: #222a44; border-radius: 4px; overflow: hidden; margin: 0 14px 12px; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#3b6cff,#6ee7a8); transition: width .3s; }
  .foot { text-align: center; color: #5b6677; font-size: 12px; padding: 24px; }
</style>
</head>
<body>
<header>
  <h1>🧪 AI 组件真实 API 验证台</h1>
  <label>模型
    <select id="model"><option value="glm-4-plus">glm-4-plus</option></select>
  </label>
  <button id="runAll" class="primary">▶ 运行全部</button>
  <button id="stop" disabled>■ 停止</button>
  <span class="spacer"></span>
  <span id="status" style="font-size:12px;color:#9aa3b2"></span>
</header>
<div class="summary" id="summary">加载中…</div>
<main id="list"></main>
<div class="foot">本页通过本地 web.py 代理调用真实大模型，API Key 不离开后端。</div>

<!-- 渲染引擎与组件 -->
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/lang/aliases.js"></script>
<script src="vendor/lang-loader.js"></script>
<script src="vendor/emoji-common.js"></script>
<script src="vendor/emoji-loader.js"></script>
<script src="vendor/flag-polyfill.js"></script>
<script src="md-renderer.js"></script>
<script src="ai-message.js"></script>

<script>
const BASE = location.origin;          // 同源访问 web.py
const PROVIDER = "zhipu";
let prompts = [];
let running = false, abort = false;

const $ = (s, r = document) => r.querySelector(s);
const statusEl = $("#status"), summaryEl = $("#summary"), listEl = $("#list");

// ---------- 工具 ----------
function estimateTokens(text) {
  const cjk = (text.match(/[一-鿿]/g) || []).length;
  const words = (text.match(/[A-Za-z0-9]+/g) || []).length;
  const punct = (text.match(/[^\sA-Za-z0-9一-鿿]/g) || []).length;
  return Math.round(cjk * 1 + words * 1.3 + punct * 0.3);
}
function coverage(md, markers) {
  let hit = 0; const missing = [];
  for (const m of (markers || [])) {
    try { if (new RegExp(m, "m").test(md)) hit++; else missing.push(m); }
    catch (e) { missing.push(m + " (bad)"); }
  }
  const total = (markers || []).length || 1;
  return { hit, total, rate: hit / total, missing };
}

// ---------- 渲染用例列表 ----------
function renderList() {
  listEl.innerHTML = "";
  prompts.forEach((p, i) => {
    const sec = document.createElement("section");
    sec.className = "case";
    sec.dataset.id = p.id;
    sec.innerHTML = `
      <div class="case-head">
        <span class="badge">${p.category || ""}</span>
        <h3>${i + 1}. ${p.title}</h3>
        <button class="run">运行</button>
      </div>
      <div class="meta" id="meta-${p.id}"><span class="idle">待运行</span></div>
      <div class="bar"><i id="bar-${p.id}"></i></div>
      <ai-message id="am-${p.id}" theme="dark" sandbox="/api/run" label="AI 回答"></ai-message>
      <div class="prompt-src">📝 测试 prompt：\n${p.prompt}</div>`;
    listEl.appendChild(sec);
    sec.querySelector(".run").addEventListener("click", () => runOne(p, sec));
  });
  updateSummary();
}

function updateSummary() {
  const done = prompts.filter(p => (p._status || "") === "ok" || (p._status || "") === "error");
  const ok = prompts.filter(p => p._status === "ok").length;
  let cov = 0, tot = 0;
  prompts.forEach(p => { if (p._cov) { cov += p._cov.hit; tot += p._cov.total; } });
  summaryEl.textContent =
    `共 ${prompts.length} 条用例 · 已完成 ${done.length} · 成功 ${ok} · ` +
    `渲染特性覆盖 ${tot ? Math.round(cov / tot * 100) : 0}% （${cov}/${tot}）`;
}

// ---------- SSE 流式运行单条 ----------
async function runOne(p, sec) {
  if (running && !confirm("已有用例在运行，仍要单独运行本条？")) return;
  const model = $("#model").value;
  const am = sec.querySelector("ai-message");
  const meta = sec.querySelector(`#meta-${p.id}`);
  const bar = sec.querySelector(`#bar-${p.id}`);
  am.markdown = ""; am.loading = true; am.tokens = null; am.latency = null; am.ttft = null;
  meta.innerHTML = `<span class="run">⏳ 流式生成中…</span>`;
  const t0 = performance.now();
  let acc = "", ttft = null, usage = {};

  try {
    const resp = await fetch(BASE + "/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        provider: PROVIDER, model, content: p.prompt,
        parameters: { temperature: 0.7, max_tokens: 1500, extra_body: { thinking: { type: "disabled" } } }
      })
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        chunk.split("\n").forEach(line => {
          if (!line.startsWith("data:")) return;
          const d = line.slice(5).trim();
          if (d === "[DONE]") return;
          let ev; try { ev = JSON.parse(d); } catch (e) { return; }
          if (ev.type === "token") {
            if (ttft == null) ttft = (performance.now() - t0) / 1000;
            acc += ev.content;
            am.markdown = acc;                 // 流式渲染
          } else if (ev.type === "done") {
            usage = ev.usage || {};
          } else if (ev.type === "error") {
            throw new Error(ev.message || "未知错误");
          }
        });
      }
    }
  } catch (e) {
    p._status = "error";
    meta.innerHTML = `<span class="err">✗ ${e.message}</span>`;
    am.loading = false; updateSummary(); return;
  }

  const latency = (performance.now() - t0) / 1000;
  const cov = coverage(acc, p.markers);
  const tok = usage.completion_tokens || estimateTokens(acc);
  am.loading = false;
  am.tokens = tok; am.latency = Math.round(latency * 1000); am.ttft = Math.round((ttft || 0) * 1000);
  p._status = "ok"; p._cov = cov;
  meta.innerHTML =
    `<span class="ok">✓ ${acc.length} 字</span>` +
    `<span>tokens≈${tok}</span>` +
    `<span>TTFT ${((ttft || 0)).toFixed(2)}s</span>` +
    `<span>延迟 ${latency.toFixed(2)}s</span>` +
    `<span class="${cov.rate >= 0.99 ? 'ok' : 'run'}">覆盖 ${cov.hit}/${cov.total}</span>`;
  bar.style.width = Math.round(cov.rate * 100) + "%";
  updateSummary();
}

// ---------- 运行全部 ----------
async function runAll() {
  if (running) return;
  running = true; abort = false;
  $("#runAll").disabled = true; $("#stop").disabled = false;
  statusEl.textContent = "批量运行中…";
  for (const p of prompts) {
    if (abort) break;
    const sec = listEl.querySelector(`[data-id="${p.id}"]`);
    await runOne(p, sec);
  }
  running = false;
  $("#runAll").disabled = false; $("#stop").disabled = true;
  statusEl.textContent = abort ? "已停止" : "全部完成";
}

// ---------- 模型下拉 ----------
async function loadModels() {
  try {
    const r = await fetch(BASE + "/api/providers");
    const list = await r.json();
    const pv = list.find(x => x.id === PROVIDER) || list[0];
    const sel = $("#model");
    sel.innerHTML = "";
    (pv?.models || []).forEach(m => {
      const o = document.createElement("option");
      o.value = m; o.textContent = m;
      if (m === "glm-4.5-air") o.selected = true;
      sel.appendChild(o);
    });
  } catch (e) { /* 用默认选项即可 */ }
}

// ---------- 启动 ----------
(async function init() {
  try {
    prompts = (await (await fetch("prompts.json")).json()).prompts;
  } catch (e) {
    summaryEl.textContent = "无法加载 prompts.json（请经 http 打开本页）";
    return;
  }
  await loadModels();
  renderList();
})();

$("#runAll").addEventListener("click", runAll);
$("#stop").addEventListener("click", () => { abort = true; });
</script>
</body>
</html>
